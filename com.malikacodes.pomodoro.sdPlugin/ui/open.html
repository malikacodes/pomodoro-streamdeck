<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <!-- Elgato's settings components. Each one saves into this key's
         settings under the name in "setting". -->
    <script src="sdpi-components.js"></script>
  </head>
  <body>
    <!-- The word under the stopwatch. The key always opens my main
         Pomodoro page on the deck it's on, so on the task page I call
         it "Back". -->
    <sdpi-item label="Word">
      <sdpi-textfield setting="label" placeholder="Pomodoro" maxlength="12"></sdpi-textfield>
    </sdpi-item>
  </body>
</html>
