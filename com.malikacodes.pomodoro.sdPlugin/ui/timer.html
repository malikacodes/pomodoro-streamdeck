<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <!-- Elgato's settings components. Each one saves into this key's
         settings under the name in "setting". -->
    <script src="sdpi-components.js"></script>
    <!-- The color box and the "New task" box are plain HTML, because
         they don't save into this key's settings like the rest. They
         belong to the task list, and timer.js sends them to the plugin.
         The colors and sizes here are copied from Elgato's own boxes so
         they sit in with them. -->
    <style>
      #color {
        width: 36px;
        height: 30px;
        padding: 0;
        border: none;
        background: none;
      }
      .add {
        display: flex;
        gap: 6px;
      }
      /* The line under the New task box. It takes up no room at all
         until there's something to say. */
      #status {
        padding-top: 4px;
        color: #969696;
        font-size: 9pt;
      }
      #status:empty {
        display: none;
      }
      #new-task {
        flex: 1;
        min-width: 0;
        height: 30px;
        box-sizing: border-box;
        padding: 0 6px;
        border: none;
        border-radius: 0;
        background-color: #3d3d3d;
        color: #d8d8d8;
        font-family: inherit;
        font-size: 9pt;
        outline: none;
      }
    </style>
  </head>
  <body>
    <!-- What I'm timing, picked from my task list. The list belongs to
         the plugin, so every Timer key and the Heat Map dial show the
         same one. "hot-reload" fills it in again when I add a task. -->
    <sdpi-item label="Task">
      <sdpi-select setting="name" datasource="getTasks" hot-reload placeholder="Pick a task"></sdpi-select>
    </sdpi-item>
    <!-- The picked task's color: its heat map, and its time on the key
         during a break. It's the task's, not this key's, so changing it
         here changes it on every key for that task. -->
    <sdpi-item label="Color">
      <input type="color" id="color" value="#f2a7c3" />
    </sdpi-item>
    <!-- Adds a task to the list and puts this key on it. The line
         underneath only shows up when an add didn't go as planned, like
         a name that's already on the list. It sits inside this row on
         purpose: a row of its own with no label still draws the colon. -->
    <sdpi-item label="New task">
      <div>
        <div class="add">
          <input type="text" id="new-task" maxlength="30" placeholder="Name" />
          <sdpi-button id="add">Add</sdpi-button>
        </div>
        <div id="status"></div>
      </div>
    </sdpi-item>

    <!-- Off makes it one plain countdown: no breaks and no rounds. -->
    <sdpi-item label="Interval timer">
      <sdpi-checkbox setting="intervals" default="true" label="Focus and breaks in rounds"></sdpi-checkbox>
    </sdpi-item>
    <!-- The lengths are in minutes. Anything that isn't a number goes
         back to the gray number shown in the box (see plan in
         src/timer.js). -->
    <sdpi-item label="Focus">
      <sdpi-textfield setting="focus" placeholder="45" pattern="[0-9.]*"></sdpi-textfield>
    </sdpi-item>
    <!-- How many focus rounds before the long break. One dot each. -->
    <sdpi-item label="Rounds">
      <sdpi-select setting="rounds" default="4">
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3</option>
        <option value="4">4</option>
        <option value="5">5</option>
        <option value="6">6</option>
        <option value="7">7</option>
        <option value="8">8</option>
      </sdpi-select>
    </sdpi-item>
    <sdpi-item label="Short break">
      <sdpi-textfield setting="shortBreak" placeholder="10" pattern="[0-9.]*"></sdpi-textfield>
    </sdpi-item>
    <sdpi-item label="Long break">
      <sdpi-textfield setting="longBreak" placeholder="15" pattern="[0-9.]*"></sdpi-textfield>
    </sdpi-item>

    <!-- Off: when a period ends, the next one waits for a tap. -->
    <sdpi-item label="Auto start">
      <sdpi-checkbox setting="autoStart" label="Start the next one by itself"></sdpi-checkbox>
    </sdpi-item>
    <!-- Tapping twice jumps to the break, or from a break back to focus.
         While this is on, a single tap takes a third of a second longer,
         because the key waits to see if a second tap is coming. -->
    <sdpi-item label="Double tap">
      <sdpi-checkbox setting="doubleTap" default="true" label="Tap twice to jump to the break"></sdpi-checkbox>
    </sdpi-item>

    <script src="timer.js"></script>
  </body>
</html>
