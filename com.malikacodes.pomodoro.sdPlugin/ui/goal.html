<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <!-- Elgato's settings components. Each one saves into this key's
         settings under the name in "setting". -->
    <script src="sdpi-components.js"></script>
  </head>
  <body>
    <!-- Whose sessions fill the ring: one task, or all of them. The ring
         is drawn in the task's color, and in pink for all tasks. -->
    <sdpi-item label="Task">
      <sdpi-select setting="task" datasource="getTasksOrAll" hot-reload placeholder="All tasks"></sdpi-select>
    </sdpi-item>
    <!-- How many sessions a day. A session is a round that ran to the
         end. The 4 shown at first is only what the menu displays.
         Nothing is saved until I pick something, so the plugin treats a
         missing goal as 4 too. -->
    <sdpi-item label="Daily goal">
      <sdpi-select setting="goal" value-type="number" default="4">
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3</option>
        <option value="4">4</option>
        <option value="5">5</option>
        <option value="6">6</option>
        <option value="7">7</option>
        <option value="8">8</option>
        <option value="9">9</option>
        <option value="10">10</option>
        <option value="11">11</option>
        <option value="12">12</option>
      </sdpi-select>
    </sdpi-item>
  </body>
</html>
